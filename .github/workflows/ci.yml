name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile app/backend/app.py
      - name: Compose config
        run: docker compose config
      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform || true
