grafana:
  adminUser: admin
  adminPassword: prom-operator
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

alertmanager:
  enabled: false

# Keep node footprint smaller for lab clusters
defaultRules:
  create: true

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
