# Integrated observability stack for three-tier-eks-iac (required, not optional).
# Installed by: ./scripts/install-monitoring.sh (also called from install-addons.sh)

grafana:
  adminUser: admin
  adminPassword: prom-operator
  service:
    type: ClusterIP
  # Pre-load Node Exporter Full dashboard (ID 1860)
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

prometheus:
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

alertmanager:
  enabled: false

defaultRules:
  create: true

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
