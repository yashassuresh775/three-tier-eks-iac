apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: three-tier
  labels:
    app: postgres
    tier: data
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: change-me-lab-only
  POSTGRES_DB: appdb
  DATABASE_URL: postgresql://app:change-me-lab-only@postgres:5432/appdb
