<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three-Tier on EKS</title>
  <style>
    :root { --ink:#14213d; --accent:#2a9d8f; --bg:#f7f4ef; }
    body { margin:0; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif; background:linear-gradient(160deg,#f7f4ef,#e8f1ef); color:var(--ink); min-height:100vh; }
    main { max-width:40rem; margin:0 auto; padding:3rem 1.25rem; }
    h1 { font-weight:400; letter-spacing:-0.02em; font-size:2rem; margin:0 0 .5rem; }
    p { color:#445; line-height:1.5; }
    form { display:flex; gap:.5rem; margin:1.5rem 0; }
    input, button { font:inherit; padding:.6rem .8rem; border-radius:6px; border:1px solid #c9c2b8; }
    input { flex:1; background:#fff; }
    button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
    ul { list-style:none; padding:0; }
    li { padding:.75rem 0; border-bottom:1px solid #ddd6cb; }
    .meta { font-size:.85rem; color:#666; }
    #status { font-family: ui-monospace, monospace; font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Three-Tier on EKS</h1>
    <p>Frontend → Backend API → PostgreSQL. Author: <a href="https://github.com/yashassuresh775">Yashas Suresh</a>.</p>
    <p id="status">Checking backend…</p>
    <form id="form">
      <input id="name" name="name" placeholder="Add an item" required />
      <button type="submit">Save</button>
    </form>
    <ul id="items"></ul>
  </main>
  <script>
    const api = (path, opts) => fetch('/api' + path, opts).then(r => {
      if (!r.ok) throw new Error(r.statusText);
      return r.json();
    });
    async function refresh() {
      try {
        const h = await api('/health');
        document.getElementById('status').textContent = JSON.stringify(h);
        const items = await api('/items');
        document.getElementById('items').innerHTML = items.map(i =>
          `<li><strong>${i.name}</strong><div class="meta">#${i.id} · ${i.created_at || ''}</div></li>`
        ).join('') || '<li class="meta">No items yet</li>';
      } catch (e) {
        document.getElementById('status').textContent = 'Backend unreachable: ' + e.message;
      }
    }
    document.getElementById('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const name = document.getElementById('name').value;
      await api('/items', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
      document.getElementById('name').value = '';
      refresh();
    });
    refresh();
  </script>
</body>
</html>
